# The project name, the folder .docker would share it with the other projects
name: ${PROJECT_NAME}

services:
  wordpress:
    build:
      context: ./wordpress
      args:
        PHP_VERSION: ${PHP_VERSION}
        WP_VERSION: ${WP_VERSION}
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ${PROJECT_NAME}_test
    restart: always
    ports:
      - ${WP_PORT}:80
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${TABLE_PREFIX}
      WORDPRESS_DEBUG: 1
    volumes:
      - ../:/var/www/html/wp-content/plugins/${PACKAGE_SLUG}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:${DB_VERSION:-8.0}
    container_name: ${PROJECT_NAME}_mysql_test
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
