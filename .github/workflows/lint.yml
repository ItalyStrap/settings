name: Coding standard

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    name: Lint and PSR-12

    runs-on: ubuntu-latest
    if: "!github.event.pull_request.draft"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Lint the PHP files
        run: find ./src/ ./tests/ -type f -name '*.php' -not -path './tests/_output/*' -print0 | xargs -0 -L 1 -P 4 -- php -l

      - uses: ramsey/composer-install@v3

      - name: Coding standard
        run: composer run cs
