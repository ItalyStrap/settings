paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed
    commands:
        - lucatume\WPBrowser\Command\GenerateWPUnit
params:
    - .docker/test.env
coverage:
    enabled: true
    include:
        - src/*
settings:
    shuffle: true
